name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - run: rustup toolchain install nightly-2026-09-25 --profile minimal --component rustfmt
      - run: cargo +nightly-2026-09-25 fmt --all --check
      - run: cargo +1.98.1 check --locked --all-targets
      - run: cargo +1.98.1 clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +1.98.1 test --locked --all-features
      - run: cargo +1.98.1 build --locked --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stratorys-smi-${{ matrix.os }}
          path: target/release/stratorys-smi
